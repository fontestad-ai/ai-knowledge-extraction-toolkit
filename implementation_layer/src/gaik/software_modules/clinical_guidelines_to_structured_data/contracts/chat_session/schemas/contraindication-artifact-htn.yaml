# 7. CHANGE CONTROL
# -----------------------------------------------------------------------------
# Any change to this schema (closed enums, the per-row constraint
# matrix, the AttendingOverridePattern denylist, the
# pregnancy_denylist_reinforcement_block, the pregnancy-denylist
# categorical rejection at the artifact layer, the held vs blocked
# routing semantics, the materialized FHIR resource id derivation,
# the post-Gate-2-reference immutability rules, validation rules,
# invariants, or example fixtures) requires:
#   - A change-controlled diff with regression evaluation against the
#     golden contraindication artifact set.
#   - Panel-chair signoff AND medical-director acknowledgement (since
#     this schema directly governs the cross-check layer that feeds
#     the IG composition of safety-critical hard-blocks).
#   - Increment of `schema_version` (semver: breaking = major).
#   - Update of `last_reviewed`.
#   - Coordinated update of every producing/consuming skill's
#     tools_lock reference and acceptance-test fixtures.
#   - Any change to: closed_cross_check_kind_set;
#     rule_scope_is_denylist_advanced;
#     pregnancy_denylist_categorical_rejection;
#     pregnancy_denylist_reinforcement_block;
#     attending_override_denylist;
#     pce_legacy_never_appears;
#     inheritance_from_parent_rule;
#     age_gate_eq_18;
#     rxnorm_pin_alignment_and_drift_detection;
#     fhir_r5_profile_compliance;
#     deterministic_id_derivation;
#     artifact_canonicalization;
#     audit_log_append_only;
#     post_gate_2_reference_immutability;
#     superseded_artifacts;
#     conflict_routing_to_panel_chair;
#     requires ALSO an ADR-HTN-001 amendment with documented
#     rationale and a new medical-director signoff.
# =============================================================================

