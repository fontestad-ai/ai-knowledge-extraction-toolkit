    attestation_id: "att-doc-HUMAN_FILL_16HEX"
    attestation_version: "1.0.0"
    predecessor_attestation_id: null
    predecessor_attestation_state: null
    guideline_manifest_ref: "guideline-manifest-hbp-2025.v1.0.0+ACC-AHA-2025+US+HUMAN_FILL_DATE.yaml"

