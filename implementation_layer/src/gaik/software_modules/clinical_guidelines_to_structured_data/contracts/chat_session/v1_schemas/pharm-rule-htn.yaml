# =============================================================================
# 7. CHANGE CONTROL
# -----------------------------------------------------------------------------
# Any change to this schema (closed enums, the per-kind constraint
# matrix, the AttendingOverridePattern denylist, the
# PregnancyDenylistConstraints, the dual-LLM family-distinct
# agreement structure, the panel-chair acknowledgement structure
# (especially the prohibition on pregnancy-denylist held-rule
# acknowledgement), the post-seal immutability rules, validation
# rules, invariants, or example fixtures) requires:
#   - A change-controlled diff with regression evaluation against the
#     golden pharm-rule set.
#   - Panel-chair signoff AND medical-director acknowledgement (since
#     this schema directly governs the rule-extraction layer that
#     feeds the prescribing-surface wiring of safety-critical
#     hard-blocks).
#   - Increment of `schema_version` (semver: breaking = major).
#   - Update of `last_reviewed`.
#   - Coordinated update of every producing/consuming skill's
#     tools_lock reference and acceptance-test fixtures.
#   - Any change to: closed_rule_kind_set; closed_support_enums;
#     dual_llm_family_distinct_agreement; hard_block_basis_for_denylist;
#     pregnancy_denylist_constraint_block; attending_override_denylist;
#     pce_legacy_never_feeds_rules; rxnorm_pin_alignment;
#     numeric_fact_integrity; verbatim_integrity;
#     panel_chair_acknowledgement_for_held; conflict_routing;
#     deterministic_id_derivation; rule_canonicalization;
#     rule_set_canonicalization; post_seal_immutability;
#     predecessor_chain; or audit_log_append_only requires ALSO an
#     ADR-HTN-001 amendment with documented rationale and a new
#     medical-director signoff.
# =============================================================================

change_control:
  semver: true
  golden_set_regression_required: true
  panel_chair_signoff_required: true
